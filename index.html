<style>
/* Layout: one-column study companion; today card, phase bars, session runner with steps + exercise, bottom tabs */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#F4F6FC; --ink:#161D38; --muted:#5D6685; --line:#DDE1EE;
  --primary:#3149C9; --primary-soft:#E3E8FB; --mark:#F6C33B; --mark-soft:#FFF3CF; --good:#1D9A68; --good-soft:#DDF3EA; --bad:#C8453B; --bad-soft:#FBE4E1;
  --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Figtree", -apple-system, system-ui, sans-serif;
  --radius:18px; --shadow:0 6px 20px rgba(22,29,56,.07); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1222; --surface:#171D33; --surface-2:#1D2440; --ink:#E9ECF8; --muted:#9AA3C4; --line:#2A3354;
  --primary:#7E93F2; --primary-soft:#232D58; --mark:#F6C33B; --mark-soft:#3A3115; --good:#4CC995; --good-soft:#173A2D; --bad:#F07A70; --bad-soft:#3E1E1C;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1222; --surface:#171D33; --surface-2:#1D2440; --ink:#E9ECF8; --muted:#9AA3C4; --line:#2A3354;
  --primary:#7E93F2; --primary-soft:#232D58; --mark:#F6C33B; --mark-soft:#3A3115; --good:#4CC995; --good-soft:#173A2D; --bad:#F07A70; --bad-soft:#3E1E1C;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
a{color:var(--primary)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.small{font-size:13px}

/* Hero */
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(150deg,#1C2760 0%,#3149C9 70%,#5A6FE0 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:var(--mark);opacity:.22}
.hero .kicker{font-size:13px;font-weight:600;opacity:.85}
.hero h1{font-size:28px;font-weight:800;margin:4px 0 2px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hstat{background:rgba(255,255,255,.14);border-radius:14px;padding:8px;text-align:center}
.hstat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.hstat span{font-size:11px;opacity:.9}

/* Today */
.today{display:block;width:100%;text-align:left;margin-top:16px;border:0;border-radius:22px;padding:18px;background:var(--mark);color:#2A2000;box-shadow:0 10px 22px rgba(246,195,59,.35)}
.today .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.today h2{font-size:22px;margin:4px 0 6px}
.today .meta{font-size:14px;font-weight:600;opacity:.85}
.today .go{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#2A2000;color:var(--mark);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}

/* Phase bars */
.phase{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;margin:12px 0}
.phase .num{width:28px;height:28px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.phase .num.done{background:var(--good);color:#fff}
.track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.phase b{font-variant-numeric:tabular-nums;font-size:14px}

/* Session list */
.sitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.dot.done{background:var(--good);border-color:var(--good);color:#fff}
.dot.prog{border-color:var(--mark);background:var(--mark-soft);color:#7A5B00}
.dot.next{border-color:var(--primary);color:var(--primary)}
.dot svg{width:15px;height:15px}
.sitem h3{font-size:15px;font-weight:600;font-family:var(--body)}
.weekhead{margin:22px 0 4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.phasehead{margin:26px 0 0;font-size:22px}

/* Session view */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.stitle{font-size:26px;font-weight:800;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.goal{background:var(--primary-soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:500}
.goal b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin-bottom:2px}
.platform{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
.platform span.muted{font-weight:500;font-size:13px;display:block}
.platform svg{width:18px;height:18px;flex:none;color:var(--primary)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--good));transition:width .4s}
.sec{font-size:18px;margin:22px 0 4px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.step.isdone{border-color:var(--good)}
.stepmain{display:flex;gap:12px;align-items:flex-start}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:16px;height:16px}
.stepnum{font-size:12px;font-weight:700;color:var(--muted)}
.steptext{font-size:15px}
.steptext .min{display:inline-block;margin-left:4px;font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 6px}
.startbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:10px 16px;border-radius:999px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;text-decoration:none;min-height:44px}
.startbtn svg{width:16px;height:16px}
.levels{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;padding-left:42px}
.levels span{font-size:12px;color:var(--muted);width:100%}
.lvl{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.lvl.on.l1{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.lvl.on.l2{background:var(--mark-soft);border-color:var(--mark);color:#7A5B00}
.lvl.on.l3{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.exercise{border:2px solid var(--primary);border-radius:18px;padding:16px;margin-top:10px;background:var(--surface)}
.exercise .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.q{margin-top:14px}
.q p{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:15px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:8px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.crit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 0;font-size:15px}
.result{margin-top:14px;padding:12px;border-radius:12px;font-weight:700;text-align:center}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.ko{background:var(--mark-soft);color:#7A5B00}
.field{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:80px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;margin-top:10px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--primary)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.celebrate{text-align:center;padding:8px 0}
.celebrate .big{font-family:var(--display);font-size:56px;line-height:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Academy visual refresh */
:root{--primary:#6545c8;--primary-soft:#ede8ff;--bg:#f4f3fa;--radius:22px;--mark:#c4b5fd;--mark-soft:#eee8ff}
:root[data-theme="dark"]{--primary:#b6a5ff;--primary-soft:#30254f;--bg:#0b1020;--surface:#151c30;--surface-2:#20283e;--line:#303a53;--mark:#c4b5fd;--mark-soft:#30254f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#b6a5ff;--primary-soft:#30254f;--bg:#0b1020;--surface:#151c30;--surface-2:#20283e;--line:#303a53;--mark:#c4b5fd;--mark-soft:#30254f}}
.wrap{max-width:760px;padding-top:24px}.hero{background:linear-gradient(125deg,#252050,#6545c8 70%,#397eaa);padding:26px;border-radius:28px}.hero::after{background:#b8e6ff;pointer-events:none}.hero h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.035em}.hero .kicker{text-transform:uppercase;letter-spacing:.12em}.card{padding:20px}.today{background:linear-gradient(120deg,#ddd6fe,#bae6fd);color:#201a40;box-shadow:0 8px 24px #6551a326}.today .go{background:#30245b;color:#fff}.sitem{transition:transform .15s,border-color .15s}.sitem:hover{border-color:var(--primary);transform:translateY(-1px)}nav.tabs{backdrop-filter:blur(18px)}nav.tabs button.on{background:var(--primary-soft);border-radius:14px}.platform{overflow-wrap:anywhere}.course-grid{display:grid;gap:12px;margin-top:18px}.course-grid .sitem{margin:0;padding:20px;min-height:100px;box-shadow:var(--shadow)}.course-grid .dot{width:46px;height:46px;font-size:20px;flex-shrink:0}.course-grid h3{font-size:19px}.academy-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:24px 0 0;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--body:system-ui,-apple-system,sans-serif;--display:system-ui,-apple-system,sans-serif}
.card{border-radius:20px;overflow-wrap:anywhere}.btn,.opt,.iconbtn{min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8b5cf6;outline-offset:3px}.lesson-theory{line-height:1.7}.lesson-theory summary{cursor:pointer;padding:12px 0;font-weight:700}.lesson-theory p{margin:8px 0 16px}.field{font-size:16px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hero{background:linear-gradient(145deg,#171d42,#3e367d 65%,#6453b0)}.card{padding:20px;border-radius:22px}.stitle{font-size:clamp(24px,5vw,34px);line-height:1.18}.card p{line-height:1.65}.opt{min-height:44px}.wrap{max-width:640px} @media(max-width:380px){.card{padding:14px}.wrap{padding-left:12px;padding-right:12px}}

.academy-brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;padding:12px 2px 18px}.academy-brand>span{color:#b6a5ff;font-size:32px}.academy-brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}.hero{background:linear-gradient(135deg,#25213f,#35275c);border:1px solid #42365e;box-shadow:none}.course-grid .sitem{background:var(--surface);border:1px solid var(--line);padding:22px 16px;min-height:112px;border-radius:20px}.course-grid .dot{background:var(--surface-2);font-size:25px}.course-grid .sitem h3{font-size:19px}.tabs{background:var(--surface)}

.wrap{max-width:680px;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}.academy-brand{font-size:17px;letter-spacing:-.03em;padding:8px 0 20px}.academy-brand img{width:40px;height:40px;border-radius:12px}.academy-brand small{font-size:11px;letter-spacing:.06em}.hero{padding:22px;border-radius:20px;background:linear-gradient(135deg,#24203e,#30264f);border-color:#49405f}.hero::after{display:none}.hero h1{font-size:clamp(25px,6vw,32px);line-height:1.15;font-weight:720;margin:8px 0}.hero .kicker{font-size:11px;letter-spacing:.09em}.hstats{gap:8px;margin-top:20px}.hstat{background:#ffffff0d;border:1px solid #ffffff20;border-radius:12px;padding:12px 4px}.hstat b{font-size:22px}.hstat span{font-size:11px}.card{padding:18px;border-radius:16px}.card h2{font-size:20px;line-height:1.25;font-weight:700}.card h3{font-size:16px}.card p{line-height:1.6}.today{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:16px;padding:18px;box-shadow:none}.today h2{font-size:23px;line-height:1.25}.today .lbl{color:var(--primary);font-size:11px}.today .meta{color:var(--muted);font-size:13px}.today .go{background:var(--primary);color:#17132b;border-radius:10px}.course-grid .sitem{padding:16px;min-height:0;border-radius:16px;align-items:flex-start}.course-grid .dot{width:42px;height:42px;border-radius:12px;border:0}.course-grid .dot svg{width:23px;height:23px}.course-grid .sitem h3{font-size:17px;line-height:1.25;margin-bottom:6px}.course-grid .small{font-size:13px}.course-grid .track{height:5px;margin:10px 0 4px}.course-arrow{color:var(--muted);flex:none;margin-top:8px}.academy-label{font-size:11px}.topbar{padding:10px 0;gap:10px}.lesson-meter{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}.lesson-meter strong{font-size:22px;color:var(--primary);font-variant-numeric:tabular-nums}.lesson-meter .progress{margin:8px 0 5px;height:7px}.lesson-meter .progress i{background:var(--primary)}.lesson-meter .small{font-size:12px}.stitle{font-size:27px;font-weight:730}.sec{font-size:19px}.step,.exercise{border-radius:14px;box-shadow:none}.opt{border-radius:10px;line-height:1.5;padding:12px 14px}.assessment-question h3{font-size:16px;line-height:1.45}.assessment .opt.correct{border-color:var(--good)}.assessment .opt.wrong{border-color:var(--bad)}.btn{border-radius:12px}.btn.primary,.startbtn{color:#17132b;background:var(--primary)}:root[data-theme="light"] .btn.primary,:root[data-theme="light"] .startbtn,:root[data-theme="light"] .today .go{color:#fff}.tabs{padding:7px 4px calc(7px + env(safe-area-inset-bottom))!important}.tabs button{min-width:0;min-height:50px;padding:5px 1px!important;font-size:10px!important;gap:4px!important}.tabs button svg{width:21px;height:21px}.tabs button.on{border-radius:10px!important}.pro-menu{display:grid;gap:8px;margin-top:16px}.pro-menu .btn{display:flex;align-items:center;gap:12px;text-align:left;margin:0;padding:14px;background:var(--surface);color:var(--ink)}.pro-menu .btn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}.pro-menu svg{width:23px;height:23px;color:var(--primary);flex:none}.pro-menu .grow small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}.session-pct{font-size:12px;font-weight:700;color:var(--primary);flex:none}.field{min-width:0}.goal{border-left:3px solid var(--primary)}

function assessmentSnapshot(q){return [q.q,q.options,q.answer];}
function migrateAssessments(sessions, stored){
 let changed=false;
 for(const s of sessions){
  const p=stored[s.id]; if(!p || !p.assessment)continue;
  const qs=[s.knowledgeCheck,...(s.advancedCheck||[])];
  for(const j of Object.keys(p.assessment)){
   const selected=p.assessment[j]; if(!Number.isInteger(selected))continue;
   const previous=p.assessmentVersions?.[j] || RC1_QUESTIONS[s.id]?.[j] || null;
   const current=qs[j]?assessmentSnapshot(qs[j]):null;
   if(previous && current && JSON.stringify(previous)===JSON.stringify(current)){
    if(!p.assessmentVersions?.[j]){(p.assessmentVersions ||= {})[j]=current;changed=true;}
    continue;
   }
   (p.assessmentHistory ||= []).push({questionIndex:Number(j),selected,question:previous,correct:previous?selected===previous[2]:null,archivedAt:new Date().toISOString()});
   delete p.assessment[j]; if(p.assessmentVersions)delete p.assessmentVersions[j];changed=true;
  }
 }
 return changed;
}
function historicalAssessmentHtml(p){
 const history=p.assessmentHistory||[]; if(!history.length)return "";
 return `<details><summary>Risultati precedenti archiviati (${history.length})</summary><p class="muted small">Non contribuiscono al punteggio delle nuove domande. Il completamento della lezione resta invariato.</p>${history.map(h=>`<p><b>${esc(h.question?.[0] || "Domanda precedente non identificabile")}</b><br>Risposta: ${esc(h.question?.[1]?.[h.selected] ?? "Opzione "+(h.selected+1))} · ${h.correct===null?"Esito non verificabile":h.correct?"Corretta":"Errata"}</p>`).join("")}</details>`;
}

const byId = id => ALL.find(s => s.id === id);
function stepsDone(s){ const p = SS()[s.id]; return p ? s.steps.filter(st => p.steps[st.id] && p.steps[st.id].done).length : 0; }
function lessonPct(s){return s.steps.length ? Math.round(100*stepsDone(s)/s.steps.length) : 0;}
function isDone(s){ const p = SS()[s.id]; return !!(p && p.completedAt); }
function status(s){ if (isDone(s)) return "done"; return stepsDone(s) > 0 ? "prog" : "todo"; }
function nextSession(){ return ALL.find(s => !isDone(s)) || null; }
function exercisePassed(s){
  const p = SS()[s.id] || {}, ex = s.exercise;
  if (ex.type === "quiz") return ex.questions.every((q, i) => p.quiz && p.quiz[i] === q.answer);
  return ex.criteria.every((c, i) => p.criteria && p.criteria[i]);
}
function streak(){
  const set = new Set(P.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate()-1);
  for (;;) { const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if (set.has(k)) { n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

const PROJECT_URL = "https://itopo-ai.github.io/diario-di-viaggio/progress.json";
let PRJ = null, PRJ_FRESH = false;
try { PRJ = JSON.parse(localStorage.getItem("aca:project") || "null"); } catch(e){}
async function loadProject(){
  try {
    const r = await fetch(PROJECT_URL, {cache:"no-cache"}); if (!r.ok) throw 0;
    PRJ = await r.json(); PRJ_FRESH = true;
    try { localStorage.setItem("aca:project", JSON.stringify(PRJ)); } catch(e){}
  } catch(e){ PRJ_FRESH = false; }
}
function prjStats(){
  const ms = (PRJ && PRJ.milestones) || [], done = ms.filter(m => m.status === "fatto").length;
  return {ms, done, pct: ms.length ? Math.round(100*done/ms.length) : 0, next: ms.find(m => m.status === "in corso") || ms.find(m => m.status !== "fatto")};
}
function projectCard(){
  if (!PRJ) return "";
  const st = prjStats();
  return `<button class="sitem" data-tab="progetto" style="margin-top:14px;padding:16px;display:block"><div class="muted small" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em">Progetto finale</div>
    <h3 style="font-size:18px;font-family:var(--display);margin-top:2px">${esc(PRJ.app)} · v${esc(PRJ.version)}</h3>
    <div class="track"><i style="width:${st.pct}%;background:var(--good)"></i></div>
    <div class="muted small" style="margin-top:6px">${st.done} di ${st.ms.length} traguardi verso la pubblicazione${st.next ? " · ora: " + esc(st.next.title) : ""}</div></button>`;

async function exportBackup(){

  const rec = lsGet("aca:s:"+ME.id,null); if(!rec) throw new Error("backup");
  const json = JSON.stringify({app:"ai-creator-academy", format:2, encrypted:rec, exportedAt:new Date().toISOString()});
  const name = "academy-" + ME.name.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-" + today() + ".json", file = new File([json], name, {type:"application/json"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Backup AI Creator Academy"}); return; } }
  catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function validProgress(v){
  const obj=x=>x!==null && typeof x==='object' && !Array.isArray(x);
  if(!obj(v) || (!obj(v.courses)&&!obj(v.sessions))) return false;
  if(v.days!==undefined && (!Array.isArray(v.days)||!v.days.every(x=>typeof x==='string'))) return false;
  const courses=v.courses||{};
  for(const c of Object.values(courses)) { if(!obj(c)||!obj(c.sessions)) return false; for(const s of Object.values(c.sessions)) { if(!obj(s)||!obj(s.steps)||!obj(s.quiz)||!obj(s.criteria)||typeof s.notes!=='string') return false; if(s.assessment!==undefined && (!obj(s.assessment)||!Object.values(s.assessment).every(x=>Number.isInteger(x)&&x>=0&&x<=2))) return false; } }
  if(v.studio!==undefined && (!Array.isArray(v.studio)||!v.studio.every(x=>obj(x)&&typeof x.title==='string'&&typeof x.body==='string'))) return false;
  return true;
}
async function importBackup(f){
  try {
    if(f.size>12*1024*1024) throw Error('size');
    const d=JSON.parse(await f.text(),(k,v)=>{if(['__proto__','constructor','prototype'].includes(k)) throw Error('key');return v;});
    if(!['ai-creator-academy','percorso-ai'].includes(d.app)) throw Error('app');
    let data=d.progress;
    if(d.format===2){const r=d.encrypted; const pw=prompt('Password del profilo al momento del backup'); if(pw===null)return; const key=await deriveKey(pw,unb64(r.salt)); data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(r.iv)},key,unb64(r.data))),(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('key');return v;});}
    if(!validProgress(data)) throw Error('structure');
    if(!(await confirmSheet('Ripristinare il backup?', 'I progressi attuali saranno sostituiti. Conserva prima una copia.', 'Ripristina')))return;
    const old=P; P=normP(data); if(S.chosen && C) migrateAssessments(ALL,SS()); if(!(await flushP())){P=old;return;} render();toast('Backup ripristinato');
  }catch(e){toast('Backup non valido o password errata');}
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "studioform" && ME){const x={type:$("#stype").value,title:$("#stitle").value.trim(),body:$("#sbody").value,url:$("#surl").value};if(!x.title)return; if(x.url&&!/^https?:\/\//i.test(x.url))return toast("Usa un link HTTP o HTTPS");P.studio=P.studio||[];if(studioEdit===null)P.studio.push(x);else P.studio[studioEdit]=x;studioEdit=null;await flushP();renderStudio();return;}
  if (e.target.id === "newform"){
    const name = $("#nname").value.trim(), pw = $("#npw").value, pw2 = $("#npw2").value;
    if (!name) return toast("Scrivi il nome dello studente");
    if (students().some(x => x.name.toLowerCase() === name.toLowerCase())) return toast("Esiste già uno studente con questo nome");
    if (pw.length < 12) return toast("La password deve avere almeno 12 caratteri");
    if (pw !== pw2) return toast("Le due password non coincidono");
    try {
      const legacy = !students().length ? lsGet(LEGACY_KEY, null) : null;
      const id = await createStudent(name, pw, legacy);
      if (legacy) { try { localStorage.removeItem(LEGACY_KEY); } catch(err){} }
      await unlock(id, pw); loginFor = null; fails = 0; await afterLogin(); toast("Benvenuto, " + name);
    } catch(err){ toast("Non riesco a creare il profilo su questo browser"); }
  }
  if (e.target.id === "loginform"){
    if (Date.now() < waitUntil) return toast("Troppi tentativi: riprova tra " + Math.ceil((waitUntil - Date.now())/1000) + " secondi");
    try { await unlock(loginFor, $("#pw").value); loginFor = null; fails = 0; await afterLogin(); window.scrollTo(0,0); }
    catch(err){ fails++; if (fails >= 5){ waitUntil = Date.now() + 30000; fails = 0; } $("#pw").value = ""; toast("Password errata"); }
  }
});
async function afterLogin(){
  S.chosen = COURSES.length < 2; CUR = P.lastCourse || "ai-creator";
  if (S.chosen){ await loadC(); }
  render();
}
async function chooseCourse(id){
  CUR = id; P.lastCourse = id; saveP();
  try { await loadC(); } catch(e){ toast("Non riesco a caricare il corso: controlla la connessione"); return; }
  S.chosen = true; S.tab = "oggi"; S.open = null; render(); window.scrollTo(0,0);
}
function changePassword(){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<form class="sheet" id="pwform" autocomplete="off"><h2 style="font-size:22px">Cambia password</h2>
    <label class="muted small" for="oldpw">Password attuale</label><input class="field" style="min-height:46px;margin:6px 0 10px" id="oldpw" type="password" required>
    <label class="muted small" for="newpw">Nuova password</label><input class="field" style="min-height:46px;margin:6px 0 10px" id="newpw" type="password" minlength="12" required>
    <div class="actions"><button class="btn" type="button" data-no>Annulla</button><button class="btn primary" type="submit">Salva</button></div></form>`;
  o.querySelector("[data-no]").onclick = () => o.remove();
  o.querySelector("form").onsubmit = async ev => {
    ev.preventDefault();
    const oldpw = $("#oldpw").value, newpw = $("#newpw").value;
    if (newpw.length < 12) return toast("La nuova password deve avere almeno 12 caratteri");
    try {
      const rec = lsGet("aca:s:" + ME.id, null), k = await deriveKey(oldpw, unb64(rec.salt));
      await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(rec.iv)}, k, unb64(rec.data));
    } catch(err){ return toast("La password attuale non è corretta"); }
    if (!(await flushP())) return;
    const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(newpw, salt);
    const previous = KEYC; KEYC = {key, salt}; if (!(await flushP())) { KEYC = previous; return; } o.remove(); toast("Password cambiata");
  };
  document.body.appendChild(o);
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ hiddenAt = Date.now(); flushP(); }
  else if (ME && hiddenAt && Date.now() - hiddenAt > 10*60*1000){ lockApp(); }
});
$("#restorepick").addEventListener("change", e => { const f = e.target.files[0]; if (f) importBackup(f); });

/* ---------- boot ---------- */
(async function boot(){
  registerSW();
  if (!(window.crypto && crypto.subtle)){ $("#app").innerHTML = `<div class="card">Apri l'app dal suo indirizzo https in Safari: serve una connessione sicura per proteggere i profili.</div>`; return; }
  loadProject().then(() => { if (C && ME && S.chosen && !S.open) render(); });
  try { await loadCourses(); } catch(e){ $("#app").innerHTML = `<div class="card">Non riesco a caricare il percorso. Controlla la connessione e riapri l'app.</div>`; return; }
  render();
})();

let proView='tutor', tutorId='';
const proNames={tutor:'AI Tutor',builder:'Project Builder',navigator:'AI Tool Navigator',skills:'Skill Map',quality:'Quality Center',glossary:'Glossario'};
const checks=['Requisiti e criteri di accettazione documentati','Test dei flussi principali e degli errori','Nessuna chiave API o password nel codice pubblico','Privacy, autorizzazioni e dati di prova controllati','Accessibilità, mobile e navigazione da tastiera','Backup, ripristino e pubblicazione verificati'];
const toolGuide=[['Scrittura e analisi','ChatGPT / Claude','Confronta accuratezza e fonti su un campione reale.','https://academy.openai.com/'],['Design e prototipi','Figma','Verifica contrasto, componenti e flussi prima di sviluppare.','https://help.figma.com/'],['Sviluppo','GitHub / MDN','Usa versionamento, test e revisione delle modifiche AI.','https://skills.github.com/'],['Automazioni','n8n','Prova con dati fittizi, errori e retry prima di attivare.','https://docs.n8n.io/'],['Database','Supabase','Controlla permessi e policy di accesso lato server.','https://supabase.com/docs'],['AI nelle app','OpenAI API','Misura costi, latenza e qualità; proteggi le chiavi.','https://platform.openai.com/docs/overview']];
function proData(){return P.pro5||(P.pro5={brief:{},skills:{},checks:{}})}
function renderPro(){const d=proData(), lesson=byId(tutorId)||ALL[0];let html='';
if(proView==='tutor') html=`<div class="card"><h2>Studia con un tutor</h2><p>Seleziona una sessione del corso attivo. Il tutor prepara una richiesta da usare in ChatGPT; non invia dati automaticamente.</p><select class="field" id="prolesson">${ALL.map(x=>`<option value="${esc(x.id)}" ${x.id===lesson?.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><div id="tutorcontent"></div><button class="btn primary" data-proact="tutorcopy">Copia richiesta al tutor</button><a class="platform" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Apri ChatGPT</a></div>`;
if(proView==='builder') html=`<div class="card"><h2>Dal problema al prodotto</h2>${[['title','Nome del progetto'],['problem','Problema e utenti'],['features','Funzioni essenziali'],['stack','Tecnologie e vincoli'],['tests','Criteri di accettazione'],['release','Piano di rilascio']].map(([k,l])=>`<label>${l}<textarea class="field" data-probrief="${k}">${esc(d.brief[k]||'')}</textarea></label>`).join('')}<button class="btn primary" data-proact="briefsave">Salva nello Studio</button><button class="btn" data-proact="briefcopy">Copia brief per AI</button></div>`;
if(proView==='navigator') html=toolGuide.map(([a,b,c,u])=>`<div class="card"><span class="pill">${a}</span><h2>${b}</h2><p>${c}</p><a class="platform" href="${u}" target="_blank" rel="noopener noreferrer">Risorsa ufficiale</a></div>`).join('');
if(proView==='skills') html=`<div class="card"><h2>Competenze del corso attivo</h2><p>Autovalutazione separata dal completamento delle lezioni. 0 = da iniziare; 3 = autonomo con evidenze.</p>${C.phases.map((x,i)=>{const key=CUR+':'+i;const a=ALL.filter(y=>y.phase===x.n);return `<div class="card"><h3>${esc(x.title)}</h3><p>${a.filter(isDone).length}/${a.length} sessioni completate</p><select class="field" data-proskill="${esc(key)}">${['Da iniziare','Con guida','Con poca assistenza','Autonomo'].map((v,j)=>`<option value="${j}" ${Number(d.skills[key]||0)===j?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}</div>`;
if(proView==='glossary') html=`<div class="card"><h2>Glossario del corso</h2>${(C.glossary||[]).map(g=>`<details><summary>${esc(g.term)} · settimana ${g.week}</summary><p>${esc(g.definition)}</p></details>`).join('')}</div>`;
if(proView==='quality') html=`<div class="card"><h2>Checklist di rilascio</h2><p>Controlli manuali del progetto corrente, non una certificazione automatica.</p>${checks.map((x,i)=>`<p><label><input type="checkbox" data-procheck="${i}" ${d.checks[i]?'checked':''}> ${x}</label></p>`).join('')}<button class="btn" data-proact="checkreset">Azzera checklist</button></div><div class="card"><h2>Risorse del corso attivo</h2><p>Apri ogni risorsa e controlla accessibilità, pertinenza e costi. Lo stato HTTP non viene verificato automaticamente.</p>${Object.values(C.platforms).filter(x=>/^https?:\/\//i.test(x.url)).map(x=>`<a class="platform" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a>`).join('')}</div>`;
$('#app').innerHTML=`<div class="hero"><div class="kicker">Release Candidate 6.6.1</div><h1>Creator Pro</h1><p>Studia, progetta, verifica.</p></div><div class="pro-menu">${Object.entries(proNames).map(([k,v])=>`<button class="btn" aria-pressed="${proView===k}" data-proview="${k}"><span class="grow">${v}<small>${({tutor:"Supporto allo studio",builder:"Dall’idea al prodotto",navigator:"Scegli gli strumenti",skills:"Misura le competenze",glossary:"Consulta i concetti",quality:"Verifica i progetti"})[k]||""}</small></span>${I.arrow}</button>`).join('')}</div>${html}`;if(proView==='tutor') updateTutor();}
function updateTutor(){const x=byId($('#prolesson')?.value);if(!x)return;tutorId=x.id;$('#tutorcontent').innerHTML=`<h3>${esc(x.title)}</h3><p>${esc(x.theory||x.goal)}</p><p><b>Verifica:</b> spiega il concetto con parole tue, applicalo a un caso nuovo e documenta un errore corretto.</p>`;}
async function proCopy(t){try{await navigator.clipboard.writeText(t);toast('Copiato')}catch(e){window.prompt('Copia il testo:',t)}}
function briefText(){return Object.entries(proData().brief).map(([k,v])=>k+': '+v).join('\n')}
document.addEventListener('input',e=>{if(!ME)return;const k=e.target.dataset.probrief;if(k){proData().brief[k]=e.target.value;saveP()}});
document.addEventListener('change',e=>{if(!ME)return;const t=e.target;if(t.id==='prolesson')updateTutor();if(t.dataset.proskill!==undefined){proData().skills[t.dataset.proskill]=Number(t.value);saveP()}if(t.dataset.procheck!==undefined){proData().checks[t.dataset.procheck]=t.checked;saveP()}});
document.addEventListener('click',async e=>{if(!ME)return;const b=e.target.closest('button');if(!b)return;if(b.id==='tutorlesson'){tutorId=S.open;S.open=null;S.tab='protools';proView='tutor';render();return}if(b.dataset.proview){proView=b.dataset.proview;renderPro();return}switch(b.dataset.proact){case 'tutorcopy':{const x=byId(tutorId);if(x)await proCopy('Agisci come tutor. Lezione: '+x.title+'\nObiettivo: '+x.goal+'\nSpiega con un esempio concreto, proponi un esercizio diverso, poi 3 domande una alla volta. Attendi le mie risposte prima di correggere. Distingui fatti e ipotesi.');break}case 'briefcopy':await proCopy('Agisci come revisore tecnico. Analizza questo brief, proponi MVP, architettura, rischi, test e piano di rilascio. Non inventare requisiti.\n'+briefText());break;case 'briefsave':{const d=proData();if(!d.brief.title?.trim())return toast('Inserisci un nome');P.studio=P.studio||[];P.studio.push({type:'Progetto',title:d.brief.title,body:briefText(),url:''});await flushP();toast('Progetto salvato nello Studio');break}case 'checkreset':if(await confirmSheet('Azzera checklist?','I controlli selezionati verranno cancellati.','Azzera')){proData().checks={};await flushP();renderPro()}break}});


function assessmentHtml(s,p){
 const qs=[s.knowledgeCheck,...(s.advancedCheck||[])], a=p.assessment||{};
 const n=qs.filter((q,i)=>Number.isInteger(a[i])).length, score=qs.filter((q,i)=>a[i]===q.answer).length;
 return `<div class="card assessment"><h2>Verifica delle competenze</h2><p role="status">Risposte ${n}/${qs.length} · Punteggio ${score}/${qs.length}</p>${qs.map((q,j)=>`<div class="assessment-question"><h3>${j+1}. ${esc(q.q)}</h3>${q.options.map((o,i)=>`<button class="opt ${a[j]===i?(i===q.answer?'correct':'wrong'):''}" aria-pressed="${a[j]===i}" data-aq="${j}" data-av="${i}">${esc(o)}</button>`).join('')}${Number.isInteger(a[j])?`<p>${a[j]===q.answer?'Corretta. '+esc(q.why):'Non corretta. '+esc(q.feedback?.[a[j]] || q.why || 'Rileggi e riprova.')}</p>`:''}</div>`).join('')}<p class="muted small">Punteggio delle ultime risposte, non una certificazione.</p>${historicalAssessmentHtml(p)}</div>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-aq]');if(!b||!ME||!S.open)return;const s=byId(S.open);if(!s?.knowledgeCheck)return;const j=Number(b.dataset.aq),i=Number(b.dataset.av),qs=[s.knowledgeCheck,...(s.advancedCheck||[])];if(!qs[j]||!Number.isInteger(i)||i<0||i>=qs[j].options.length)return;const p=sp(s.id);p.assessment=p.assessment||{};p.assessment[j]=i;(p.assessmentVersions ||= {})[j]=assessmentSnapshot(qs[j]);markActive();await flushP();renderSession(s);});
})();
</script>
